type: object
description: Halaman hasil list user dengan pagination berbasis `after`.
required:
  - data
  - nextAfter
properties:
  data:
    type: array
    description: Daftar user pada halaman ini.
    items:
      $ref: './User.yaml'
  nextAfter:
    type:
      - string
      - 'null'
    format: uuid
    description: |
      UUID item terakhir pada halaman ini, untuk dikirim sebagai query `after`
      pada request berikutnya. Bernilai `null` bila tidak ada halaman lagi.
    examples:
      - 8f14e45f-ea9f-4b1c-9c3f-1a2b3c4d5e6f
      - null
additionalProperties: false
examples:
  - data:
      - id: 8f14e45f-ea9f-4b1c-9c3f-1a2b3c4d5e6f
        username: budi.santoso
        name: Budi Santoso
        createdAt: '2026-01-15T08:30:00Z'
        updatedAt: '2026-01-20T10:00:00Z'
    nextAfter: null
