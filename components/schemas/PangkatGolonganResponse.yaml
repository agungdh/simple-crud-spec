type: object
description: Representasi data pangkat dan golongan.
additionalProperties: false
required:
  - uuid
  - jenjang
  - pangkat
  - golongan
  - ruang
properties:
  uuid:
    type: string
    format: uuid
    examples:
      - '019352a1-7b40-7000-8000-000000000020'
  jenjang:
    type: string
    examples:
      - 'Penata'
  pangkat:
    type: string
    examples:
      - 'Penata Muda Tingkat I'
  golongan:
    type: string
    examples:
      - 'III'
  ruang:
    type: string
    examples:
      - 'b'
examples:
  - uuid: '019352a1-7b40-7000-8000-000000000020'
    jenjang: 'Penata'
    pangkat: 'Penata Muda Tingkat I'
    golongan: 'III'
    ruang: 'b'
