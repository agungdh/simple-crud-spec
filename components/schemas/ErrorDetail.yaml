type: object
description: Detail satu masalah validasi pada satu field.
required:
  - field
  - issue
properties:
  field:
    type: string
    description: Nama field yang bermasalah, dalam format dotted path bila nested.
    examples:
      - username
  issue:
    type: string
    description: Penjelasan singkat mengapa field tersebut ditolak.
    examples:
      - already taken
additionalProperties: false
examples:
  - field: username
    issue: already taken
