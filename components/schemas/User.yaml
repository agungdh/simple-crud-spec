type: object
description: |
  Representasi user yang dikembalikan API. Password dan kolom audit
  (`createdAt`, `updatedAt`, `createdBy`, `updatedBy`, `deletedAt`, `version`)
  tidak pernah disertakan pada response.
required:
  - uuid
  - username
  - name
properties:
  uuid:
    type: string
    format: uuid
    description: UUID unik user.
    examples:
      - 8f14e45f-ea9f-4b1c-9c3f-1a2b3c4d5e6f
  username:
    $ref: './Username.yaml'
  name:
    $ref: './Name.yaml'
additionalProperties: false
examples:
  - uuid: 8f14e45f-ea9f-4b1c-9c3f-1a2b3c4d5e6f
    username: budi.santoso
    name: Budi Santoso
