type: object
description: |
  Representasi user yang dikembalikan API. Password dan kolom audit
  (`createdAt`, `updatedAt`, `createdBy`, `updatedBy`, `deletedAt`, `version`)
  tidak pernah disertakan pada response.
required:
  - uuid
  - username
  - name
properties:
  uuid:
    type: string
    format: uuid
    description: UUID unik user.
    examples:
      - 8f14e45f-ea9f-4b1c-9c3f-1a2b3c4d5e6f
  username:
    type: string
    minLength: 3
    maxLength: 32
    pattern: '^[a-zA-Z0-9._-]+$'
    description: |
      Username unik yang dipakai untuk login. Hanya boleh berisi huruf, angka,
      titik, underscore, dan tanda hubung.
    examples:
      - budi.santoso
  name:
    type: string
    minLength: 1
    maxLength: 100
    description: Nama lengkap user.
    examples:
      - Budi Santoso
additionalProperties: false
examples:
  - uuid: 8f14e45f-ea9f-4b1c-9c3f-1a2b3c4d5e6f
    username: budi.santoso
    name: Budi Santoso
