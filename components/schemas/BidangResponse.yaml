type: object
description: Representasi data bidang.
additionalProperties: false
required:
  - uuid
  - bidang
properties:
  uuid:
    type: string
    format: uuid
    examples:
      - '019352a1-7b40-7000-8000-000000000010'
  bidang:
    type: string
    examples:
      - 'Inspektorat Pembantu Wilayah I'
examples:
  - uuid: '019352a1-7b40-7000-8000-000000000010'
    bidang: 'Inspektorat Pembantu Wilayah I'
