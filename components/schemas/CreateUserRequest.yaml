type: object
description: Payload untuk membuat user baru. Memuat password karena hanya dipakai saat write.
required:
  - username
  - name
  - password
properties:
  username:
    $ref: './Username.yaml'
  name:
    $ref: './Name.yaml'
  password:
    $ref: './Password.yaml'
additionalProperties: false
examples:
  - username: budi.santoso
    name: Budi Santoso
    password: S3cretPass!
