name: sort
in: query
required: false
description: |
  Field yang dipakai sebagai kunci pengurutan. Hanya field DTO yang boleh dipakai;
  kolom audit tidak pernah menjadi kunci sort. Nilai default dan tie-breaker
  ditentukan server; kontrak ini tidak menjamin urutan tertentu bila parameter
  tidak dikirim.
schema:
