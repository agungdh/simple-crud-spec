openapi: 3.2.0
info:
  title: SIMON-JP Core API
  version: 1.0.0
  summary: Hybrid Authentication & Master Data API
  description: >-
    API autentikasi (Bearer Token & HttpOnly Cookie dengan sliding session)
    serta manajemen master data Bidang, Pangkat Golongan, dan Pegawai.

servers:
  - url: http://localhost:8080/api
    description: Local Development Server

tags:
  - name: Auth
    description: Manajemen autentikasi dan sesi pengguna
  - name: Bidangs
    description: Manajemen master data bidang
  - name: Pangkat Golongans
    description: Manajemen master data pangkat dan golongan
  - name: Pegawais
    description: Manajemen data pegawai dan akun pengguna (relasi 1-to-1)

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /login:
    post:
      operationId: loginUser
      summary: User Login
      description: >-
        Melakukan autentikasi kredensial, mengembalikan opaque token di JSON body,
        dan mengatur HttpOnly session cookie secara bersamaan.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          headers:
            Set-Cookie:
              description: HttpOnly session cookie untuk browser client (diabaikan oleh native mobile client)
              schema:
                type: string
                examples:
                  - 'session_id=9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=86400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /logout:
    post:
      operationId: logoutUser
      summary: User Logout
      description: >-
        Menghapus sesi aktif di server (revokasi token) serta mengirimkan Set-Cookie
        dengan Max-Age=0 untuk menghapus cookie di browser.
      tags:
        - Auth
      responses:
        '204':
          description: Logout berhasil
          headers:
            Set-Cookie:
              description: Mengosongkan dan kedaluwarsakan session cookie di browser
              schema:
                type: string
                examples:
                  - 'session_id=; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=0'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /me:
    get:
      operationId: getCurrentUser
      summary: Get Current Authenticated Pegawai
      description: >-
        Mengambil profil akun dan data pegawai yang sedang login sekaligus
        memperpanjang masa aktif sesi (sliding session).
      tags:
        - Auth
      responses:
        '200':
          description: Profil pengguna aktif berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PegawaiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /bidangs:
    get:
      operationId: listBidangs
      summary: List Bidangs
      description: Mengambil daftar seluruh bidang.
      tags:
        - Bidangs
      responses:
        '200':
          description: Daftar bidang berhasil diambil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BidangResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '5XX':
          $ref: '#/components/responses/ServerError'

    post:
      operationId: createBidang
      summary: Create Bidang
      description: Menambahkan data bidang baru.
      tags:
        - Bidangs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BidangRequest'
      responses:
        '201':
          description: Bidang berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidangResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /bidangs/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID unik bidang
        schema:
          type: string
          format: uuid
          examples:
            - '019352a1-7b40-7000-8000-000000000010'
    get:
      operationId: getBidang
      summary: Get Bidang Detail
      description: Mengambil detail satu bidang berdasarkan UUID.
      tags:
        - Bidangs
      responses:
        '200':
          description: Detail bidang berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidangResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '5XX':
          $ref: '#/components/responses/ServerError'

    put:
      operationId: updateBidang
      summary: Replace Bidang
      description: Memperbarui seluruh data bidang secara penuh (full replace).
      tags:
        - Bidangs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BidangRequest'
      responses:
        '200':
          description: Bidang berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidangResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '5XX':
          $ref: '#/components/responses/ServerError'

    delete:
      operationId: deleteBidang
      summary: Delete Bidang
      description: Menghapus data bidang berdasarkan UUID.
      tags:
        - Bidangs
      responses:
        '204':
          description: Bidang berhasil dihapus
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /pangkat-golongans:
    get:
      operationId: listPangkatGolongans
      summary: List Pangkat Golongans
      description: Mengambil daftar seluruh pangkat dan golongan.
      tags:
        - Pangkat Golongans
      responses:
        '200':
          description: Daftar pangkat golongan berhasil diambil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PangkatGolonganResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '5XX':
          $ref: '#/components/responses/ServerError'

    post:
      operationId: createPangkatGolongan
      summary: Create Pangkat Golongan
      description: Menambahkan data pangkat golongan baru.
      tags:
        - Pangkat Golongans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PangkatGolonganRequest'
      responses:
        '201':
          description: Pangkat golongan berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PangkatGolonganResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /pangkat-golongans/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID unik pangkat golongan
        schema:
          type: string
          format: uuid
          examples:
            - '019352a1-7b40-7000-8000-000000000020'
    get:
      operationId: getPangkatGolongan
      summary: Get Pangkat Golongan Detail
      description: Mengambil detail satu pangkat golongan berdasarkan UUID.
      tags:
        - Pangkat Golongans
      responses:
        '200':
          description: Detail pangkat golongan berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PangkatGolonganResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '5XX':
          $ref: '#/components/responses/ServerError'

    put:
      operationId: updatePangkatGolongan
      summary: Replace Pangkat Golongan
      description: Memperbarui seluruh data pangkat golongan secara penuh (full replace).
      tags:
        - Pangkat Golongans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PangkatGolonganRequest'
      responses:
        '200':
          description: Pangkat golongan berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PangkatGolonganResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '5XX':
          $ref: '#/components/responses/ServerError'

    delete:
      operationId: deletePangkatGolongan
      summary: Delete Pangkat Golongan
      description: Menghapus data pangkat golongan berdasarkan UUID.
      tags:
        - Pangkat Golongans
      responses:
        '204':
          description: Pangkat golongan berhasil dihapus
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /pegawais:
    get:
      operationId: listPegawais
      summary: List Pegawais
      description: Mengambil daftar seluruh pegawai beserta informasi akun user (1-to-1).
      tags:
        - Pegawais
      responses:
        '200':
          description: Daftar pegawai berhasil diambil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PegawaiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '5XX':
          $ref: '#/components/responses/ServerError'

    post:
      operationId: createPegawai
      summary: Create Pegawai & User Account
      description: >-
        Membuat data pegawai baru sekaligus membuat akun user (username dan password)
        secara atomik dalam relasi 1-to-1.
      tags:
        - Pegawais
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePegawaiRequest'
      responses:
        '201':
          description: Pegawai dan akun user berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PegawaiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /pegawais/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID unik pegawai
        schema:
          type: string
          format: uuid
          examples:
            - '019352a1-7b40-7000-8000-000000000030'
    get:
      operationId: getPegawai
      summary: Get Pegawai Detail
      description: Mengambil detail satu pegawai beserta informasi akun user berdasarkan UUID pegawai.
      tags:
        - Pegawais
      responses:
        '200':
          description: Detail pegawai berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PegawaiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '5XX':
          $ref: '#/components/responses/ServerError'

    put:
      operationId: updatePegawai
      summary: Replace Pegawai & User Account
      description: >-
        Memperbarui seluruh data pegawai dan username secara penuh (full replace).
        Password dapat diisi null apabila tidak ingin mengganti password lama.
      tags:
        - Pegawais
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePegawaiRequest'
      responses:
        '200':
          description: Data pegawai berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PegawaiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '5XX':
          $ref: '#/components/responses/ServerError'

    delete:
      operationId: deletePegawai
      summary: Delete Pegawai & User Account
      description: Menghapus data pegawai beserta akun user terkait (cascade delete).
      tags:
        - Pegawais
      responses:
        '204':
          description: Pegawai dan akun user berhasil dihapus
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '5XX':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OpaqueToken
      description: 'Masukkan token pada header Authorization: Bearer <token>'
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_id
      description: Session cookie otomatis dikirim oleh browser

  responses:
    BadRequest:
      description: Permintaan tidak valid atau format payload rusak
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            badRequest:
              value:
                message: 'Bad Request'

    Unauthorized:
      description: Tidak terautentikasi atau sesi/kredensial tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                message: 'Unauthorized'

    Forbidden:
      description: Tidak memiliki hak akses untuk resource ini
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                message: 'Forbidden'

    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                message: 'Not Found'

    MethodNotAllowed:
      description: HTTP method tidak diizinkan pada endpoint ini (router-level)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            methodNotAllowed:
              value:
                message: 'Method Not Allowed'

    UnprocessableEntity:
      description: Validasi input gagal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

    ServerError:
      description: Kesalahan internal server yang tidak terduga
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            serverError:
              value:
                message: 'Internal Server Error'

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
          examples:
            - 'agung'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 255
          examples:
            - 'rahasia123'

    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          description: Token sesi untuk disimpan di storage mobile/non-browser client
          examples:
            - '9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08'

    BidangRequest:
      type: object
      additionalProperties: false
      required:
        - bidang
      properties:
        bidang:
          type: string
          minLength: 1
          maxLength: 255
          examples:
            - 'Inspektorat Pembantu Wilayah I'

    BidangResponse:
      type: object
      additionalProperties: false
      required:
        - uuid
        - bidang
      properties:
        uuid:
          type: string
          format: uuid
          examples:
            - '019352a1-7b40-7000-8000-000000000010'
        bidang:
          type: string
          examples:
            - 'Inspektorat Pembantu Wilayah I'

    PangkatGolonganRequest:
      type: object
      additionalProperties: false
      required:
        - jenjang
        - pangkat
        - golongan
        - ruang
      properties:
        jenjang:
          type: string
          minLength: 1
          maxLength: 255
          examples:
            - 'Penata'
        pangkat:
          type: string
          minLength: 1
          maxLength: 255
          examples:
            - 'Penata Muda Tingkat I'
        golongan:
          type: string
          minLength: 1
          maxLength: 255
          examples:
            - 'III'
        ruang:
          type: string
          minLength: 1
          maxLength: 255
          examples:
            - 'b'

    PangkatGolonganResponse:
      type: object
      additionalProperties: false
      required:
        - uuid
        - jenjang
        - pangkat
        - golongan
        - ruang
      properties:
        uuid:
          type: string
          format: uuid
          examples:
            - '019352a1-7b40-7000-8000-000000000020'
        jenjang:
          type: string
          examples:
            - 'Penata'
        pangkat:
          type: string
          examples:
            - 'Penata Muda Tingkat I'
        golongan:
          type: string
          examples:
            - 'III'
        ruang:
          type: string
          examples:
            - 'b'

    PegawaiTipe:
      type: string
      enum:
        - pegawai
        - admin
      examples:
        - 'pegawai'

    PegawaiStatus:
      type: string
      enum:
        - aktif
        - non aktif
      examples:
        - 'aktif'

    KategoriJabatan:
      type: string
      enum:
        - struktural
        - fungsional auditor
        - fungsional tertentu
      examples:
        - 'fungsional auditor'

    KategoriKebutuhanJamPelatihan:
      type: string
      enum:
        - admin
        - pejabat
        - auditor
      examples:
        - 'auditor'

    CreatePegawaiRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
        - bidangUuid
        - pangkatGolonganUuid
        - tipe
        - status
        - nip
        - nama
        - jabatan
        - kategoriJabatan
        - peran
        - kategoriKebutuhanJamPelatihan
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
          examples:
            - '199701012022031001'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 255
          examples:
            - 'password123'
        bidangUuid:
          type: string
          format: uuid
          examples:
            - '019352a1-7b40-7000-8000-000000000010'
        pangkatGolonganUuid:
          type:
            - string
            - 'null'
          format: uuid
          examples:
            - '019352a1-7b40-7000-8000-000000000020'
        tipe:
          $ref: '#/components/schemas/PegawaiTipe'
        status:
          $ref: '#/components/schemas/PegawaiStatus'
        nip:
          type: string
          minLength: 1
          maxLength: 255
          examples:
            - '199701012022031001'
        nama:
          type: string
          minLength: 1
          maxLength: 255
          examples:
            - 'Agung Sapto Margono'
        jabatan:
          type:
            - string
            - 'null'
          maxLength: 255
          examples:
            - 'Auditor Ahli Pertama'
        kategoriJabatan:
          anyOf:
            - $ref: '#/components/schemas/KategoriJabatan'
            - type: 'null'
          examples:
            - 'fungsional auditor'
        peran:
          type:
            - string
            - 'null'
          maxLength: 255
          examples:
            - 'Anggota Tim'
        kategoriKebutuhanJamPelatihan:
          anyOf:
            - $ref: '#/components/schemas/KategoriKebutuhanJamPelatihan'
            - type: 'null'
          examples:
            - 'auditor'

    UpdatePegawaiRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
        - bidangUuid
        - pangkatGolonganUuid
        - tipe
        - status
        - nip
        - nama
        - jabatan
        - kategoriJabatan
        - peran
        - kategoriKebutuhanJamPelatihan
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
          examples:
            - '199701012022031001'
        password:
          type:
            - string
            - 'null'
          format: password
          minLength: 8
          maxLength: 255
          description: Isi null jika tidak ingin mengubah password
          examples:
            - null
        bidangUuid:
          type: string
          format: uuid
          examples:
            - '019352a1-7b40-7000-8000-000000000010'
        pangkatGolonganUuid:
          type:
