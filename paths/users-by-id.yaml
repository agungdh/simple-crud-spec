get:
  summary: Get user
  description: Mengambil satu user berdasarkan UUID. Response tidak memuat password.
  operationId: getUser
  tags:
    - Users
  parameters:
    - $ref: '../components/parameters/Uuid.yaml'
  responses:
    '200':
      description: User ditemukan.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/User.yaml'
          examples:
            found:
              summary: User tanpa password dan kolom audit
              value:
                uuid: 8f14e45f-ea9f-4b1c-9c3f-1a2b3c4d5e6f
                username: budi.santoso
                name: Budi Santoso
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '500':
      $ref: '../components/responses/InternalError.yaml'
put:
  summary: Update user
  description: |
    Mengganti seluruh state user (full replacement). Client wajib mengirim
    `username`, `name`, dan `password`; semua field pada payload bersifat wajib.
    `password` tidak pernah muncul di response.
  operationId: updateUser
  tags:
    - Users
  parameters:
    - $ref: '../components/parameters/Uuid.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/UpdateUserRequest.yaml'
        examples:
          replaceAll:
            summary: Ganti seluruh state user
            value:
              username: budi.santoso
              name: Budi S.
              password: N3wS3cret!
  responses:
    '200':
      description: User berhasil diperbarui.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/User.yaml'
          examples:
            updated:
              summary: User setelah update, tanpa password dan kolom audit
              value:
                uuid: 8f14e45f-ea9f-4b1c-9c3f-1a2b3c4d5e6f
                username: budi.santoso
                name: Budi S.
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '409':
      $ref: '../components/responses/Conflict.yaml'
    '500':
      $ref: '../components/responses/InternalError.yaml'
delete:
  summary: Delete user
  description: Menghapus user berdasarkan UUID.
  operationId: deleteUser
  tags:
    - Users
  parameters:
    - $ref: '../components/parameters/Uuid.yaml'
  responses:
    '204':
      description: User berhasil dihapus; tidak ada body.
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '500':
      $ref: '../components/responses/InternalError.yaml'
